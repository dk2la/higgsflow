[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "higgsflow"
version = "0.1.1"
description = "Unofficial local CLI for the Higgsfield API, organised around self-contained projects"
requires-python = ">=3.12"
dependencies = [
    "typer>=0.12",
    "rich>=13.7",
    "httpx>=0.27",
    "pydantic>=2.7",
    "jsonschema>=4.22",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2",
    "respx>=0.21",
    "mypy>=1.10",
    "types-jsonschema>=4.22",
    # ruff adds rules to the selected sets in minor releases; bump the range on purpose.
    "ruff>=0.17,<0.18",
]

[project.scripts]
higgs = "hfcli.app:main"

[tool.hatch.build.targets.wheel]
packages = ["src/hfcore", "src/hfcli"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
target-version = "py312"
line-length = 120

[tool.ruff.lint]
# Ruff's defaults (E4, E7, E9, F) plus W, I (import order), B (bugbear), UP, SIM and T20 (print).
# E501 is left out: there is no formatter, and lines run to ~120 by hand.
select = ["E4", "E7", "E9", "F", "W", "I", "B", "UP", "SIM", "T20"]

[tool.ruff.lint.per-file-ignores]
# T20 (no print) is for hfcore only (DESIGN §3): the CLI and the catalog build script print
# by design.
"src/hfcli/**" = ["T20"]
"src/hfcore/catalog/build.py" = ["T20"]

[tool.ruff.lint.isort]
# hfcli is built on hfcore, so hfcore's imports come first, in the same block.
known-first-party = ["hfcore"]
known-local-folder = ["hfcli"]
no-lines-before = ["local-folder"]

[tool.mypy]
python_version = "3.12"
files = ["src", "tests"]
strict = true
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = "tests.*"
disallow_untyped_defs = false
disallow_incomplete_defs = false
